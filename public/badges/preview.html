<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Badge Preview</title>
    <style>
      :root {
        color-scheme: light;
        --page: #f7f6f2;
        --surface: #fffefa;
        --border: #dedbd2;
        --border-strong: #c7c1b6;
        --ink: #1c1d20;
        --muted: #696a70;
        --tile: #efede7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 16px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 24px;
        line-height: 1.2;
        font-weight: 720;
        letter-spacing: 0;
      }

      h2 {
        font-size: 16px;
        line-height: 1.3;
        font-weight: 700;
        letter-spacing: 0;
      }

      .summary {
        margin-top: 6px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .asset-count {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .section {
        margin-top: 24px;
      }

      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 10px;
      }

      .pattern {
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
      }

      .level-card {
        display: grid;
        grid-template-rows: 190px auto;
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }

      .art {
        display: grid;
        place-items: center;
        border-bottom: 1px solid var(--border);
        background:
          linear-gradient(45deg, var(--tile) 25%, transparent 25%),
          linear-gradient(-45deg, var(--tile) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, var(--tile) 75%),
          linear-gradient(-45deg, transparent 75%, var(--tile) 75%);
        background-color: #faf9f5;
        background-position:
          0 0,
          0 10px,
          10px -10px,
          -10px 0;
        background-size: 20px 20px;
      }

      .badge {
        width: 160px;
        height: 178px;
        object-fit: contain;
      }

      .info {
        display: grid;
        gap: 3px;
        padding: 9px 10px 10px;
      }

      .level {
        font-size: 12px;
        font-weight: 720;
        line-height: 1.3;
      }

      .name {
        min-height: 34px;
        color: var(--ink);
        font-size: 12px;
        line-height: 1.35;
      }

      .file {
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      @media (max-width: 1080px) {
        .grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      @media (max-width: 740px) {
        main {
          padding: 18px 12px 28px;
        }

        header,
        .section-head {
          align-items: flex-start;
          flex-direction: column;
        }

        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .level-card {
          grid-template-rows: 170px auto;
        }

        .badge {
          width: 144px;
          height: 160px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Badge Preview</h1>
          <p class="summary">Bộ badge canonical: 12 cấp, mỗi cấp có phiên bản nam và nữ.</p>
        </div>
        <p class="asset-count">24 PNG · 640×709</p>
      </header>

      <section class="section" aria-labelledby="male-title">
        <div class="section-head">
          <h2 id="male-title">Nam</h2>
          <p class="pattern">badge-{level}-male.png</p>
        </div>
        <div class="grid" id="male-grid"></div>
      </section>

      <section class="section" aria-labelledby="female-title">
        <div class="section-head">
          <h2 id="female-title">Nữ</h2>
          <p class="pattern">badge-{level}-female.png</p>
        </div>
        <div class="grid" id="female-grid"></div>
      </section>
    </main>

    <script>
      const assetVersion = "20260514-last3-safe-crop";
      const levels = [
        "Người Tập Sự",
        "Người Hầu Sự",
        "Sứ Giả Tân Binh",
        "Hộ Vệ Tập Sự",
        "Thiên Sứ Sơ Cấp",
        "Thiên Sứ Hộ Mệnh",
        "Thiên Sứ Truyền Tin",
        "Thiên Sứ Chữa Lành",
        "Thiên Sứ Chiến Binh",
        "Đội Trưởng Thiên Sứ",
        "Chỉ Huy Thiên Quân",
        "Tổng Quản Thiên Giới",
      ];

      function renderGrid(gender) {
        const grid = document.getElementById(`${gender}-grid`);
        grid.innerHTML = levels
          .map((name, index) => {
            const level = index + 1;
            const file = `badge-${level}-${gender}.png`;
            const genderLabel = gender === "male" ? "nam" : "nữ";

            return `
              <article class="level-card">
                <div class="art">
                  <img class="badge" src="./${file}?v=${assetVersion}" alt="Badge cấp ${level} ${genderLabel}: ${name}" loading="lazy" />
                </div>
                <div class="info">
                  <p class="level">Cấp ${level}</p>
                  <p class="name">${name}</p>
                  <p class="file">${file}</p>
                </div>
              </article>
            `;
          })
          .join("");
      }

      renderGrid("male");
      renderGrid("female");
    </script>
  </body>
</html>
