<template id="beat-2-dashboard-template">
  <div
    data-composition-id="beat-2-dashboard"
    data-start="0"
    data-duration="8"
    data-width="1080"
    data-height="1920"
  >
    <section class="scene scene-dashboard">
      <div class="scene-content">
        <div class="chapter-tag">B02 • Dashboard</div>
        <div class="dashboard-head">
          <h1 class="scene-title">Mọi nhiệm vụ, XP và tiến độ gói trong một màn.</h1>
          <p class="scene-subtitle">
            Dashboard cho thấy số nhiệm vụ hôm nay, nhiệm vụ tháng, cấp độ hiện tại
            và nhịp hoạt động gần nhất.
          </p>
        </div>

        <div class="dashboard-stage">
          <div class="phone-frame dashboard-shot">
            <img
              src="http://127.0.0.1:3011/screenshots/member-dashboard-mobile.png"
              alt="Màn hình dashboard thành viên"
            />
          </div>

          <svg class="flow-svg" viewBox="0 0 1080 1920" aria-hidden="true">
            <path
              class="flow-path dashboard-path"
              d="M 770 930 C 850 860, 870 760, 790 640 C 700 520, 650 420, 690 300"
            />
          </svg>

          <div class="glass-panel dashboard-notes">
            <div class="pill-row">
              <div class="mini-pill"><strong>3</strong> nhiệm vụ hôm nay</div>
              <div class="mini-pill"><strong>90 XP</strong> hiện tại</div>
              <div class="mini-pill"><strong>Lv.1</strong> tân binh</div>
            </div>
            <div class="bullet-list">
              <div class="bullet-row">
                <div class="bullet-index">A</div>
                <p>Hero card cho biết level, lời hôm nay và thanh tiến độ.</p>
              </div>
              <div class="bullet-row">
                <div class="bullet-index">B</div>
                <p>Cụm nhiệm vụ hôm nay và nhiệm vụ tháng tách riêng rất dễ quét.</p>
              </div>
              <div class="bullet-row">
                <div class="bullet-index">C</div>
                <p>Phần hoạt động gần đây giúp leader nhìn nhịp làm việc tức thì.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <style>
      [data-composition-id="beat-2-dashboard"] .dashboard-stage {
        position: relative;
        flex: 1;
      }

      [data-composition-id="beat-2-dashboard"] .dashboard-shot {
        position: absolute;
        left: 48px;
        top: 220px;
        width: 480px;
        height: 1080px;
        z-index: 2;
      }

      [data-composition-id="beat-2-dashboard"] .dashboard-notes {
        position: absolute;
        right: 0;
        top: 360px;
        width: 430px;
        display: flex;
        flex-direction: column;
        gap: 22px;
        z-index: 3;
      }

      [data-composition-id="beat-2-dashboard"] .dashboard-path {
        stroke-dasharray: 720;
        stroke-dashoffset: 720;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from(".scene-dashboard .chapter-tag, .scene-dashboard .scene-title, .scene-dashboard .scene-subtitle", {
        y: 36,
        opacity: 0,
        duration: 0.7,
        stagger: 0.1,
        ease: "power3.out",
      }, 0);
      tl.from(".scene-dashboard .dashboard-shot", {
        y: 120,
        opacity: 0,
        scale: 0.92,
        duration: 0.92,
        ease: "power3.out",
      }, 0.28);
      tl.from(".scene-dashboard .dashboard-notes", {
        x: 70,
        opacity: 0,
        duration: 0.75,
        ease: "power2.out",
      }, 0.56);
      tl.to(".scene-dashboard .dashboard-path", {
        strokeDashoffset: 0,
        duration: 1.15,
        ease: "power2.out",
      }, 0.72);
      tl.to(".scene-dashboard .dashboard-shot", {
        y: -24,
        scale: 1.02,
        duration: 3.1,
        yoyo: true,
        repeat: 1,
        ease: "sine.inOut",
      }, 1.45);
      tl.to(".scene-dashboard .dashboard-notes .mini-pill", {
        y: -8,
        duration: 1.1,
        stagger: 0.08,
        yoyo: true,
        repeat: 2,
        ease: "sine.inOut",
      }, 1.4);
      tl.to(".scene-dashboard .scene-content", {
        y: -140,
        opacity: 0,
        filter: "blur(24px)",
        duration: 0.4,
        ease: "power3.in",
      }, 7.55);

      window.__timelines["beat-2-dashboard"] = tl;
    </script>
  </div>
</template>
