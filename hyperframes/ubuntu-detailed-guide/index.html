<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Outfit";
        src: url("http://127.0.0.1:3011/fonts/Outfit-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Outfit";
        src: url("http://127.0.0.1:3011/fonts/Outfit-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: "DM Sans";
        src: url("http://127.0.0.1:3011/fonts/DMSans-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "DM Sans";
        src: url("http://127.0.0.1:3011/fonts/DMSans-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }

      :root {
        --bg: #f6f7fb;
        --surface: rgba(255, 255, 255, 0.82);
        --surface-strong: rgba(255, 255, 255, 0.94);
        --text: #0f172a;
        --muted: #64748b;
        --blue: #0ea5e9;
        --sky: #38bdf8;
        --cyan: #22d3ee;
        --success: #34d399;
        --warning: #f59e0b;
        --reward: #fb7185;
        --border: rgba(100, 116, 139, 0.22);
        --shadow: 0 30px 70px rgba(56, 189, 248, 0.14);
        --gradient-main: linear-gradient(135deg, #38bdf8 0%, #60a5fa 52%, #22d3ee 100%);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
        font-family: "DM Sans", sans-serif;
        color: var(--text);
      }

      body {
        position: relative;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 14%, rgba(56, 189, 248, 0.36), transparent 25%),
          radial-gradient(circle at 82% 20%, rgba(34, 211, 238, 0.2), transparent 22%),
          radial-gradient(circle at 50% 100%, rgba(14, 165, 233, 0.18), transparent 34%),
          linear-gradient(180deg, #fbfdff 0%, #f4f8fc 38%, #eef5fb 100%);
      }

      .global-bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .mesh-orb,
      .pulse-ring,
      .grid-fade {
        position: absolute;
        pointer-events: none;
      }

      .mesh-orb {
        filter: blur(12px);
        border-radius: 999px;
      }

      .orb-a {
        width: 420px;
        height: 420px;
        top: -80px;
        left: -110px;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.48) 0%, rgba(56, 189, 248, 0.04) 70%);
      }

      .orb-b {
        width: 360px;
        height: 360px;
        right: -80px;
        top: 220px;
        background: radial-gradient(circle, rgba(34, 211, 238, 0.38) 0%, rgba(34, 211, 238, 0.05) 72%);
      }

      .orb-c {
        width: 420px;
        height: 420px;
        right: -90px;
        bottom: -120px;
        background: radial-gradient(circle, rgba(14, 165, 233, 0.24) 0%, rgba(14, 165, 233, 0.03) 76%);
      }

      .grid-fade {
        inset: 0;
        background-image:
          linear-gradient(rgba(125, 211, 252, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(125, 211, 252, 0.08) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.55), transparent 82%);
        opacity: 0.55;
      }

      .pulse-ring {
        width: 720px;
        height: 720px;
        left: 180px;
        top: 520px;
        border: 1px solid rgba(56, 189, 248, 0.2);
        border-radius: 999px;
        filter: blur(1px);
      }

      .corner-chip {
        position: absolute;
        top: 48px;
        right: 52px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 22px;
        background: rgba(255, 255, 255, 0.62);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 999px;
        box-shadow: 0 18px 36px rgba(14, 165, 233, 0.08);
        backdrop-filter: blur(18px);
        font-size: 20px;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .corner-chip img {
        width: 34px;
        height: 34px;
      }

      .scene {
        width: 100%;
        height: 100%;
      }

      .scene-content {
        width: 100%;
        height: 100%;
        padding: 132px 72px 112px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .chapter-tag {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        gap: 12px;
        padding: 16px 24px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.74);
        border: 1px solid rgba(56, 189, 248, 0.24);
        box-shadow: 0 18px 32px rgba(56, 189, 248, 0.1);
        color: var(--blue);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .scene-title {
        font-family: "Outfit", sans-serif;
        font-size: 74px;
        line-height: 0.96;
        letter-spacing: -0.04em;
        max-width: 840px;
      }

      .scene-subtitle {
        max-width: 760px;
        font-size: 28px;
        line-height: 1.45;
        color: var(--muted);
      }

      .phone-frame {
        position: relative;
        border-radius: 46px;
        padding: 18px;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(148, 163, 184, 0.24);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .phone-frame::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(180deg, rgba(56, 189, 248, 0.3), rgba(255, 255, 255, 0.4));
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      .phone-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 32px;
        display: block;
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid var(--border);
        backdrop-filter: blur(18px);
        box-shadow: 0 16px 36px rgba(14, 165, 233, 0.08);
        border-radius: 34px;
        padding: 26px 28px;
      }

      .bullet-list {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .bullet-row {
        display: grid;
        grid-template-columns: 48px 1fr;
        gap: 16px;
        align-items: start;
      }

      .bullet-index {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(180deg, rgba(56, 189, 248, 0.18), rgba(34, 211, 238, 0.24));
        color: var(--blue);
        font-family: "Outfit", sans-serif;
        font-size: 22px;
        font-weight: 700;
      }

      .bullet-row p {
        font-size: 24px;
        line-height: 1.42;
        color: var(--text);
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      .mini-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 20px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.84);
        border: 1px solid rgba(148, 163, 184, 0.22);
        color: var(--text);
        font-size: 20px;
        font-weight: 700;
        box-shadow: 0 12px 24px rgba(14, 165, 233, 0.08);
      }

      .mini-pill strong {
        color: var(--blue);
      }

      .stat-card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 200px;
        padding: 22px 24px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(148, 163, 184, 0.22);
        box-shadow: 0 16px 32px rgba(14, 165, 233, 0.08);
      }

      .stat-card .label {
        font-size: 18px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 700;
      }

      .stat-card .value {
        font-family: "Outfit", sans-serif;
        font-size: 42px;
        line-height: 1;
      }

      .flow-svg {
        position: absolute;
        inset: 0;
        overflow: visible;
        pointer-events: none;
      }

      .flow-path {
        fill: none;
        stroke: rgba(14, 165, 233, 0.55);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-dasharray: 18 16;
      }

      .thumbnail {
        border-radius: 26px;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.24);
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 20px 34px rgba(14, 165, 233, 0.09);
      }

      .thumbnail img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="51"
      data-width="1080"
      data-height="1920"
    >
      <div class="global-bg">
        <div class="grid-fade"></div>
        <div class="mesh-orb orb-a"></div>
        <div class="mesh-orb orb-b"></div>
        <div class="mesh-orb orb-c"></div>
        <div class="pulse-ring"></div>
      </div>

      <div class="corner-chip">
        <img src="http://127.0.0.1:3011/branding/logo.svg" alt="Ubuntu logo" />
        <span>Ubuntu Walkthrough</span>
      </div>

      <div
        id="beat-1"
        data-composition-id="beat-1-login"
        data-composition-src="compositions/beat-1-login.html"
        data-start="0"
        data-duration="6"
        data-width="1080"
        data-height="1920"
        data-track-index="1"
      ></div>
      <div
        id="beat-2"
        data-composition-id="beat-2-dashboard"
        data-composition-src="compositions/beat-2-dashboard.html"
        data-start="6"
        data-duration="8"
        data-width="1080"
        data-height="1920"
        data-track-index="1"
      ></div>
      <div
        id="beat-3"
        data-composition-id="beat-3-task"
        data-composition-src="compositions/beat-3-task.html"
        data-start="14"
        data-duration="7.5"
        data-width="1080"
        data-height="1920"
        data-track-index="1"
      ></div>
      <div
        id="beat-4"
        data-composition-id="beat-4-customers"
        data-composition-src="compositions/beat-4-customers.html"
        data-start="21.5"
        data-duration="9"
        data-width="1080"
        data-height="1920"
        data-track-index="1"
      ></div>
      <div
        id="beat-5"
        data-composition-id="beat-5-stats-shop"
        data-composition-src="compositions/beat-5-stats-shop.html"
        data-start="30.5"
        data-duration="7.5"
        data-width="1080"
        data-height="1920"
        data-track-index="1"
      ></div>
      <div
        id="beat-6"
        data-composition-id="beat-6-admin"
        data-composition-src="compositions/beat-6-admin.html"
        data-start="38"
        data-duration="7.5"
        data-width="1080"
        data-height="1920"
        data-track-index="1"
      ></div>
      <div
        id="beat-7"
        data-composition-id="beat-7-outro"
        data-composition-src="compositions/beat-7-outro.html"
        data-start="45.5"
        data-duration="5.5"
        data-width="1080"
        data-height="1920"
        data-track-index="1"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to(".orb-a", {
        x: 90,
        y: 70,
        scale: 1.14,
        duration: 51,
        ease: "sine.inOut",
      }, 0);
      tl.to(".orb-b", {
        x: -110,
        y: -80,
        scale: 0.92,
        duration: 51,
        ease: "sine.inOut",
      }, 0);
      tl.to(".orb-c", {
        x: -70,
        y: -110,
        scale: 1.1,
        duration: 51,
        ease: "sine.inOut",
      }, 0);
      tl.to(".pulse-ring", {
        scale: 1.15,
        opacity: 0.5,
        duration: 12.75,
        repeat: 3,
        yoyo: true,
        ease: "sine.inOut",
      }, 0);
      tl.to(".grid-fade", {
        opacity: 0.72,
        duration: 25.5,
        yoyo: true,
        repeat: 1,
        ease: "sine.inOut",
      }, 0);
      tl.to(".corner-chip", {
        y: -6,
        duration: 8.5,
        repeat: 5,
        yoyo: true,
        ease: "sine.inOut",
      }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
